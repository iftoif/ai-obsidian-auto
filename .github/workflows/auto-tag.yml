name: auto-tag

on:
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装系统依赖（shellcheck + bats）
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck bats
      - name: 安装 Python 依赖
        run: pip install -q pytest pytest-cov chromadb zstandard
      - name: L0 静态分析（shellcheck 零 error/warning，含集成/安全/测试脚本）
        run: |
          set -e
          ERRORS=$(shellcheck -x scripts/*.sh tests/*.sh tests/integration/*.sh tests/security/*.sh tests/unit/*.bats 2>&1 | grep -cE ':[0-9]+:[0-9]+: (error|warning)' || true)
          echo "shellcheck error/warning: $ERRORS"
          [ "$ERRORS" -eq 0 ]
          python3 -m py_compile scripts/*.py tests/*.py tests/unit/*.py 2>/dev/null || python3 -m py_compile scripts/*.py
      - name: L1 单元测试（pytest）
        run: python3 -m pytest tests/unit/ -q --tb=short
      - name: L1 bash 单元测试（bats）
        run: bats tests/unit/*.bats
      - name: L2 集成测试
        run: |
          bash tests/integration/test_env_propagation.sh
          bash tests/integration/test_export_pipeline.sh
      - name: L3 E2E 冒烟测试
        run: bash tests/smoke.sh
      - name: L4 安全矩阵
        run: bash tests/security/test_security_matrix.sh
      - name: L5 变异验证（Python + bash，kill rate 100%）
        run: |
          python3 tests/mutation.py
          bash tests/mutation_bash.sh
      - name: L0b 一致性检查（QA-PLAN §7 七项）
        run: bash tests/consistency.sh
      - name: 一致性检查（占位符/敏感信息，-E 修复 BRE 死检查）
        run: |
          set -e
          # 注意：必须用 -E（ERE），BRE 下 | 是字面量导致检查永不触发
          if grep -rnE 'your-provider|your-model|<your-key>' scripts/ .env.example 2>/dev/null; then
            echo '占位符残留'; exit 1
          fi
          if grep -rnE 'aaronhk|/home/aaron|192.168.[0-9]' scripts/ docs/ templates/ .env.example 2>/dev/null; then
            echo '敏感信息'; exit 1
          fi
          echo "一致性检查通过"

  auto-version:
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 自动 bump 版本并打 tag + 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # 读最新版本 tag（无则从 v0.0.0 起）
          LATEST=$(git tag -l 'v*' | sort -V | tail -1 || true)
          LATEST=${LATEST:-v0.0.0}
          MSG=$(git log -1 --format=%s)
          echo "最新版本: $LATEST | 提交: $MSG"

          # 按提交类型决定 bump：BREAKING → major / feat: → minor / 其余 → patch
          # 注意：awk 对 v1 会强转数字丢 v 前缀 → 先去掉 v 再算，算完再加回
          BASE=$(echo "$LATEST" | sed 's/^v//')
          if echo "$MSG" | grep -q 'BREAKING'; then
            NEW=$(echo "$BASE" | awk -F. '{print $1+1".0.0"}')
          elif [[ "$MSG" == feat:* ]]; then
            NEW=$(echo "$BASE" | awk -F. '{print $1"."$2+1".0"}')
          else
            NEW=$(echo "$BASE" | awk -F. '{print $1"."$2"."$3+1}')
          fi
          NEW="v$NEW"
          echo "新版本: $NEW"

          if git tag -l "$NEW" | grep -q .; then
            echo "tag $NEW 已存在，跳过"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW" -m "$NEW: $MSG"
          git push origin "$NEW"
          # 创建/更新 GitHub Release（v 前缀正确）
          gh release create "$NEW" --title "$NEW" --notes "$MSG" --generate-notes 2>/dev/null || true
          echo "✅ 已打 tag: $NEW + Release"