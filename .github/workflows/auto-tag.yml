name: auto-tag

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 语法检查
        run: python3 -m py_compile scripts/*.py
      - name: 安装测试依赖
        run: pip install -q pytest chromadb 2>/dev/null || true
      - name: 单元测试（semantic 测试缺 sentence-transformers 自动 skip）
        run: python3 -m pytest tests/unit/ -q --ignore=tests/unit/test_semantic.py || python3 -m pytest tests/unit/ -q

  auto-version:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 自动 bump 版本并打 tag + 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # 读最新版本 tag（无则从 v0.0.0 起）
          LATEST=$(git tag -l 'v*' | sort -V | tail -1 || true)
          LATEST=${LATEST:-v0.0.0}
          MSG=$(git log -1 --format=%s)
          echo "最新版本: $LATEST | 提交: $MSG"

          # 按提交类型决定 bump：BREAKING → major / feat: → minor / 其余 → patch
          # 注意：awk 对 v1 会强转数字丢 v 前缀 → 先去掉 v 再算，算完再加回
          BASE=$(echo "$LATEST" | sed 's/^v//')
          if echo "$MSG" | grep -q 'BREAKING'; then
            NEW=$(echo "$BASE" | awk -F. '{print $1+1".0.0"}')
          elif [[ "$MSG" == feat:* ]]; then
            NEW=$(echo "$BASE" | awk -F. '{print $1"."$2+1".0"}')
          else
            NEW=$(echo "$BASE" | awk -F. '{print $1"."$2"."$3+1}')
          fi
          NEW="v$NEW"
          echo "新版本: $NEW"

          if git tag -l "$NEW" | grep -q .; then
            echo "tag $NEW 已存在，跳过"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW" -m "$NEW: $MSG"
          git push origin "$NEW"
          # 创建/更新 GitHub Release（v 前缀正确）
          gh release create "$NEW" --title "$NEW" --notes "$MSG" --generate-notes 2>/dev/null || true
          echo "✅ 已打 tag: $NEW + Release"